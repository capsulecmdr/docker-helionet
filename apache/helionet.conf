<VirtualHost *:80>
    ServerName helionet.local

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog  /var/log/apache2/helionet-error.log
    CustomLog /var/log/apache2/helionet-access.log combined

    # Security / hardening headers similar to what you had with Nginx
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
